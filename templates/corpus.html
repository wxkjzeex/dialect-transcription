<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Параллельный корпус · Притча о блудном сыне</title>
    <style>
        /* ==================== ПОДКЛЮЧЕНИЕ ШРИФТОВ ==================== */
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;600&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Serif', 'Times New Roman', serif;
            background: #f5efe6;
            min-height: 100vh;
            padding: 24px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: #fffbf5;
            border-radius: 24px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            overflow: hidden;
            border: 1px solid #d4c5b0;
        }
        .header {
            background: linear-gradient(135deg, #4a3d2c 0%, #2c241a 100%);
            color: #f0e6d8;
            padding: 24px 32px;
            border-bottom: 3px solid #b89a7a;
        }
        .header h1 { font-size: 28px; font-weight: 400; letter-spacing: 2px; }
        .header p { opacity: 0.8; font-size: 14px; margin-top: 8px; }
        .tabs {
            display: flex;
            background: #e8ddd0;
            padding: 0 24px;
            gap: 4px;
        }
        .tab {
            padding: 14px 24px;
            font-size: 14px;
            font-weight: 600;
            color: #6b5a4a;
            cursor: pointer;
            border-radius: 12px 12px 0 0;
            transition: all 0.2s;
            text-decoration: none;
        }
        .tab:hover { background: #d9cbbc; }
        .tab.active { background: #fffbf5; color: #4a3d2c; }
        .content { padding: 32px; }
        .upload-area {
            border: 2px dashed #c9af91;
            border-radius: 16px;
            padding: 32px;
            text-align: center;
            margin-bottom: 24px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .upload-area:hover { border-color: #8b7355; background: #faf5ef; }
        .btn {
            padding: 12px 24px;
            background: #4a3d2c;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn:hover { background: #5d4e37; transform: translateY(-2px); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-secondary { background: #8b7355; }
        .file-list { margin-top: 16px; }
        .file-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            background: #f0eae2;
            border-radius: 8px;
            margin-bottom: 8px;
        }
        .file-remove { color: #a05040; cursor: pointer; font-weight: bold; }
        .controls {
            display: flex;
            gap: 12px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        
        /* Таблица выравнивания */
        .alignment-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 24px;
            font-size: 14px;
        }
        .alignment-table th {
            text-align: left;
            padding: 12px;
            background: #e8ddd0;
            color: #3e3225;
            font-weight: 600;
            border: 1px solid #d4c5b0;
        }
        .alignment-table td {
            padding: 12px;
            border: 1px solid #d4c5b0;
            vertical-align: top;
        }
        .alignment-table tr:hover td { background: #faf5ef; }
        
        /* Типы разночтений */
        .diff-graphic { background: #fde2e4 !important; border-left: 3px solid #c0392b; }
        .diff-phonetic { background: #fff3cd !important; border-left: 3px solid #d4a017; }
        .diff-morph { background: #d4edda !important; border-left: 3px solid #27ae60; }
        .diff-lexical { background: #e2d5f1 !important; border-left: 3px solid #8e44ad; }
        .diff-syntax { background: #d1ecf1 !important; border-left: 3px solid #2980b9; }
        .diff-insertion { background: #ffe5e0 !important; border-left: 3px solid #e74c3c; }
        .diff-deletion { background: #e0e0e0 !important; border-left: 3px solid #636e72; }
        
        /* Легенда */
        .legend {
            margin: 20px 0;
            padding: 16px;
            background: #f0eae2;
            border-radius: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }
        .legend-color {
            width: 24px;
            height: 16px;
            border-radius: 3px;
            border-left: 3px solid;
        }
        
        /* Статистика */
        .stats {
            margin: 20px 0;
            padding: 16px;
            background: #f8f2ea;
            border-radius: 12px;
            border: 1px solid #d4c5b0;
        }
        .stat-item {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin: 8px 16px 8px 0;
            font-size: 14px;
        }
        
        /* Матрица сходства */
        .similarity-matrix {
            margin: 20px 0;
            overflow-x: auto;
        }
        .similarity-matrix table {
            border-collapse: collapse;
            font-size: 13px;
        }
        .similarity-matrix th, .similarity-matrix td {
            padding: 8px 12px;
            border: 1px solid #d4c5b0;
            text-align: center;
        }
        .similarity-matrix th {
            background: #e8ddd0;
            font-weight: 600;
        }
        .high-sim { background: #d4edda; }
        .med-sim { background: #fff3cd; }
        .low-sim { background: #fde2e4; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📜 Притча о блудном сыне</h1>
            <p>Параллельный корпус · Лк 15:11-32 · Лабораторная работа №2</p>
        </div>
        
        <div class="tabs">
            <a href="/" class="tab">Транскрипция</a>
            <a href="/corpus" class="tab active">Корпус</a>
            <a href="/map" class="tab">Карта</a>
        </div>
        
        <div class="content">
            <div class="upload-area" id="dropZone">
                <div style="font-size: 48px; margin-bottom: 16px;">📂</div>
                <div style="font-size: 18px; margin-bottom: 8px;">Загрузите файлы списков</div>
                <div style="color: #9a8a78;">XML-TEI · Перетащите или нажмите для выбора</div>
                <input type="file" id="fileInput" multiple accept=".xml" style="display: none;">
            </div>
            
            <div id="fileList" class="file-list"></div>
            
            <div class="controls">
                <div style="display: flex; gap: 8px; align-items: center;">
                    <label style="font-size: 13px; color: #3e3225;">Листы главного списка:</label>
                    <input type="number" id="folioStart" placeholder="От" min="1" max="500" value="117" style="width: 70px; padding: 8px; border-radius: 6px; border: 1px solid #d4c5b0;">
                    <span>–</span>
                    <input type="number" id="folioEnd" placeholder="До" min="1" max="500" value="119" style="width: 70px; padding: 8px; border-radius: 6px; border: 1px solid #d4c5b0;">
                </div>
                <button class="btn" id="alignBtn" disabled>🔗 Выровнять списки</button>
                <button class="btn btn-secondary" id="exportBtn" disabled>💾 Выгрузить XML-TEI</button>
                <select id="mainMsSelect" style="padding: 12px; border-radius: 8px; border: 1px solid #d4c5b0;" disabled>
                    <option value="">Выберите главный список</option>
                </select>
            </div>
            
            <div id="progress" style="display: none;"></div>
            <div id="alignmentResult"></div>
        </div>
    </div>
    
    <script>
        let uploadedFiles = [];
        let manuscripts = [];
        let alignedData = null;
        let currentSessionId = null;
        
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const fileList = document.getElementById('fileList');
        const alignBtn = document.getElementById('alignBtn');
        const exportBtn = document.getElementById('exportBtn');
        const mainMsSelect = document.getElementById('mainMsSelect');
        const progressDiv = document.getElementById('progress');
        
        // Drag & drop
        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = '#8b7355';
            dropZone.style.background = '#faf5ef';
        });
        dropZone.addEventListener('dragleave', () => {
            dropZone.style.borderColor = '#c9af91';
            dropZone.style.background = 'transparent';
        });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = '#c9af91';
            dropZone.style.background = 'transparent';
            handleFiles(e.dataTransfer.files);
        });
        fileInput.addEventListener('change', (e) => handleFiles(e.target.files));
        
        // Загрузка файлов на сервер
        async function handleFiles(files) {
            for (let file of files) {
                if (file.name.endsWith('.xml') && !uploadedFiles.find(f => f.name === file.name)) {
                    uploadedFiles.push(file);
                }
            }
            
            if (uploadedFiles.length > 0) {
                progressDiv.style.display = 'block';
                progressDiv.innerHTML = '⏳ Загрузка файлов на сервер...';
                
                const formData = new FormData();
                uploadedFiles.forEach(file => {
                    formData.append('files', file);
                });
                
                try {
                    const response = await fetch('/upload_corpus', {
                        method: 'POST',
                        body: formData
                    });
                    
                    if (!response.ok) {
                        throw new Error('Ошибка загрузки');
                    }
                    
                    const result = await response.json();
                    manuscripts = result.manuscripts;
                    
                    progressDiv.innerHTML = '✅ Файлы загружены и распарсены!';
                    setTimeout(() => { progressDiv.style.display = 'none'; }, 1500);
                } catch (err) {
                    progressDiv.innerHTML = '❌ Ошибка: ' + err.message;
                    console.error(err);
                }
            }
            
            renderFileList();
            updateUI();
        }
        
        function renderFileList() {
            if (uploadedFiles.length === 0) {
                fileList.innerHTML = '';
                return;
            }
            let html = '<h3 style="margin-bottom: 12px; color: #3e3225;">Загруженные списки:</h3>';
            uploadedFiles.forEach((file, index) => {
                const ms = manuscripts[index];
                const wordCount = ms ? ms.word_count : '...';
                html += `
                    <div class="file-item">
                        <span>📄 ${file.name} <span style="color: #8b7355;">(${wordCount} слов)</span></span>
                        <span class="file-remove" onclick="removeFile(${index})">✕</span>
                    </div>
                `;
            });
            fileList.innerHTML = html;
            
            let options = '<option value="">Выберите главный список</option>';
            manuscripts.forEach((ms, index) => {
                options += `<option value="${index}">${ms.name}</option>`;
            });
            mainMsSelect.innerHTML = options;
        }
        
        window.removeFile = function(index) {
            uploadedFiles.splice(index, 1);
            manuscripts.splice(index, 1);
            alignedData = null;
            document.getElementById('alignmentResult').innerHTML = '';
            renderFileList();
            updateUI();
        };
        
        function updateUI() {
            alignBtn.disabled = manuscripts.length < 2;
            exportBtn.disabled = !alignedData;
            mainMsSelect.disabled = manuscripts.length < 2;
        }
        
        // Выравнивание
        alignBtn.addEventListener('click', async () => {
            const mainIndex = parseInt(mainMsSelect.value);
            if (isNaN(mainIndex)) {
                alert('Выберите главный список');
                return;
            }
            
            const startSheet = document.getElementById('folioStart').value;
            const endSheet = document.getElementById('folioEnd').value;
            
            progressDiv.style.display = 'block';
            progressDiv.innerHTML = '⏳ Выполняется выравнивание...';
            
            try {
                const response = await fetch('/align', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        manuscripts: manuscripts,
                        main_index: mainIndex,
                        folio_start: startSheet,
                        folio_end: endSheet
                    })
                });
                
                if (!response.ok) {
                    throw new Error('Ошибка выравнивания');
                }
                
                const result = await response.json();
                alignedData = result;
                currentSessionId = result.session_id;
                
                progressDiv.style.display = 'none';
                renderAlignment(result);
                exportBtn.disabled = false;
            } catch (err) {
                progressDiv.innerHTML = '❌ Ошибка: ' + err.message;
                console.error(err);
            }
        });
        
        // Отрисовка результатов
        function renderAlignment(data) {
            const container = document.getElementById('alignmentResult');
            
            // Статистика разночтений
            let statsHtml = '<div class="stats"><h3>📊 Статистика разночтений</h3>';
            if (data.statistics) {
                const stats = data.statistics;
                statsHtml += `
                    <div class="stat-item">📝 Всего позиций: <strong>${stats.total}</strong></div>
                    <div class="stat-item">✅ Совпадений: <strong>${stats.matches}</strong> (${stats.match_percent}%)</div>
                    <div class="stat-item">✏️ Графические: <strong>${stats.graphic}</strong></div>
                    <div class="stat-item">🗣️ Фонетические: <strong>${stats.phonetic}</strong></div>
                    <div class="stat-item">📐 Морфологические: <strong>${stats.morph}</strong></div>
                    <div class="stat-item">📚 Лексические: <strong>${stats.lexical}</strong></div>
                    <div class="stat-item">➕ Вставки: <strong>${stats.insertion}</strong></div>
                `;
            }
            statsHtml += '</div>';
            
            // Легенда
            statsHtml += `
                <div class="legend">
                    <div class="legend-item"><div class="legend-color" style="background: #fde2e4; border-color: #c0392b;"></div> Графические</div>
                    <div class="legend-item"><div class="legend-color" style="background: #fff3cd; border-color: #d4a017;"></div> Фонетические</div>
                    <div class="legend-item"><div class="legend-color" style="background: #d4edda; border-color: #27ae60;"></div> Морфологические</div>
                    <div class="legend-item"><div class="legend-color" style="background: #e2d5f1; border-color: #8e44ad;"></div> Лексические</div>
                    <div class="legend-item"><div class="legend-color" style="background: #ffe5e0; border-color: #e74c3c;"></div> Вставки</div>
                </div>
            `;
            
            // Матрица сходства
            if (data.similarity_matrix) {
                statsHtml += '<div class="similarity-matrix"><h4>📈 Матрица сходства списков</h4><table>';
                statsHtml += '<tr><th>Список</th>';
                data.similarity_matrix.labels.forEach(label => {
                    statsHtml += `<th>${label}</th>`;
                });
                statsHtml += '</tr>';
                
                data.similarity_matrix.matrix.forEach((row, i) => {
                    statsHtml += `<tr><td><strong>${data.similarity_matrix.labels[i]}</strong></td>`;
                    row.forEach((val, j) => {
                        let cls = '';
                        if (i === j) cls = 'high-sim';
                        else if (val >= 70) cls = 'high-sim';
                        else if (val >= 50) cls = 'med-sim';
                        else cls = 'low-sim';
                        statsHtml += `<td class="${cls}">${val}%</td>`;
                    });
                    statsHtml += '</tr>';
                });
                statsHtml += '</table></div>';
            }
            
            // Таблица выравнивания
            let tableHtml = '<h3>📖 Пословное выравнивание</h3>';
            tableHtml += '<div style="overflow-x: auto; max-height: 600px; overflow-y: auto; border: 1px solid #d4c5b0; border-radius: 8px;">';
            tableHtml += '<table class="alignment-table">';
            
            // Заголовки
            tableHtml += '<thead><tr><th>№</th>';
            data.manuscript_names.forEach(name => {
                tableHtml += `<th>${name}</th>`;
            });
            tableHtml += '<th>Тип</th></tr></thead><tbody>';
            
            // Строки
            data.alignment.forEach((row, index) => {
                tableHtml += '<tr>';
                tableHtml += `<td><strong>${index + 1}</strong></td>`;
                
                let hasDiff = false;
                const mainWord = row[0];
                
                row.forEach((word, colIdx) => {
                    tableHtml += `<td>${word || '—'}</td>`;
                    if (colIdx > 0 && data.diff_types) {
                        const diffType = data.diff_types[index]?.[colIdx - 1];
                        if (diffType && diffType !== 'match') hasDiff = true;
                    }
                });
                
                // Тип разночтения
                tableHtml += '<td>';
                if (data.diff_types) {
                    const types = data.diff_types[index] || [];
                    const uniqueTypes = [...new Set(types.filter(t => t !== 'match'))];
                    if (uniqueTypes.length > 0) {
                        uniqueTypes.forEach(type => {
                            const labels = {
                                'graphic': 'ГР', 'phonetic': 'ФН', 'morph': 'МФ',
                                'lexical': 'ЛК', 'insertion': 'ВСТ', 'deletion': 'УД'
                            };
                            tableHtml += `<span style="background: ${getColorForType(type)}; color: white; padding: 2px 6px; border-radius: 4px; margin: 2px; font-size: 11px;">${labels[type] || type}</span>`;
                        });
                    } else {
                        tableHtml += '✓';
                    }
                }
                tableHtml += '</td></tr>';
            });
            
            tableHtml += '</tbody></table></div>';
            
            container.innerHTML = statsHtml + tableHtml;
        }
        
        function getColorForType(type) {
            const colors = {
                'graphic': '#c0392b',
                'phonetic': '#d4a017',
                'morph': '#27ae60',
                'lexical': '#8e44ad',
                'insertion': '#e74c3c',
                'deletion': '#636e72'
            };
            return colors[type] || '#95a5a6';
        }
        
        // Экспорт в TEI XML
        exportBtn.addEventListener('click', async () => {
            if (!alignedData) return;
            
            try {
                const response = await fetch('/export_tei', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        session_id: currentSessionId,
                        data: alignedData
                    })
                });
                
                if (!response.ok) {
                    throw new Error('Ошибка экспорта');
                }
                
                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'aligned_corpus.xml';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            } catch (err) {
                alert('Ошибка экспорта: ' + err.message);
            }
        });
    </script>
</body>
</html>
