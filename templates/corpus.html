<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Параллельный корпус · Притча о блудном сыне</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;600&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Serif', 'Times New Roman', serif;
            background: #f5efe6;
            min-height: 100vh;
            padding: 24px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: #fffbf5;
            border-radius: 24px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            overflow: hidden;
            border: 1px solid #d4c5b0;
        }
        .header {
            background: linear-gradient(135deg, #4a3d2c 0%, #2c241a 100%);
            color: #f0e6d8;
            padding: 24px 32px;
            border-bottom: 3px solid #b89a7a;
        }
        .header h1 { font-size: 28px; font-weight: 400; letter-spacing: 2px; }
        .header p { opacity: 0.8; font-size: 14px; margin-top: 8px; }
        .tabs { display: flex; background: #e8ddd0; padding: 0 24px; gap: 4px; }
        .tab {
            padding: 14px 24px; font-size: 14px; font-weight: 600;
            color: #6b5a4a; cursor: pointer; border-radius: 12px 12px 0 0;
            transition: all 0.2s; text-decoration: none;
        }
        .tab:hover { background: #d9cbbc; }
        .tab.active { background: #fffbf5; color: #4a3d2c; }
        .content { padding: 32px; }
        .upload-area {
            border: 2px dashed #c9af91; border-radius: 16px; padding: 32px;
            text-align: center; margin-bottom: 24px; cursor: pointer; transition: all 0.2s;
        }
        .upload-area:hover { border-color: #8b7355; background: #faf5ef; }
        .btn {
            padding: 12px 24px; background: #4a3d2c; color: white; border: none;
            border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer;
            transition: all 0.2s; margin: 4px;
        }
        .btn:hover { background: #5d4e37; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-secondary { background: #8b7355; }
        .file-list { margin-top: 16px; }
        .file-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 16px; background: #f0eae2; border-radius: 8px; margin-bottom: 8px;
        }
        .file-remove { color: #a05040; cursor: pointer; font-weight: bold; }
        .controls { display: flex; gap: 12px; margin: 20px 0; flex-wrap: wrap; align-items: center; }
        .alignment-table { width: 100%; border-collapse: collapse; margin-top: 24px; font-size: 14px; }
        .alignment-table th {
            text-align: left; padding: 12px; background: #e8ddd0; color: #3e3225;
            font-weight: 600; border: 1px solid #d4c5b0; position: sticky; top: 0; z-index: 10;
        }
        .alignment-table td { padding: 12px; border: 1px solid #d4c5b0; vertical-align: top; }
        .alignment-table tr:hover td { background: #faf5ef; }
        .diff-graphic { background: #fde2e4 !important; }
        .diff-phonetic { background: #fff3cd !important; }
        .diff-morph { background: #d4edda !important; }
        .diff-lexical { background: #e2d5f1 !important; }
        .diff-insertion { background: #ffe5e0 !important; }
        .diff-deletion { background: #e0e0e0 !important; }
        .stats { margin: 20px 0; padding: 16px; background: #f8f2ea; border-radius: 12px; border: 1px solid #d4c5b0; }
        .stat-item { display: inline-flex; align-items: center; gap: 8px; margin: 8px 16px 8px 0; font-size: 14px; }
        .progress { margin: 20px 0; padding: 12px; background: #e8ddd0; border-radius: 8px; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📜 Притча о блудном сыне</h1>
            <p>Параллельный корпус · Лк 15:11-32 · Лабораторная работа №2</p>
        </div>
        <div class="tabs">
            <a href="/" class="tab">Транскрипция</a>
            <a href="/corpus" class="tab active">Корпус</a>
            <a href="/map" class="tab">Карта</a>
        </div>
        <div class="content">
            <div class="upload-area" id="dropZone">
                <div style="font-size:48px;margin-bottom:16px;">📂</div>
                <div>Загрузите файлы списков (XML-TEI)</div>
                <div style="color:#9a8a78;">Перетащите или нажмите</div>
                <input type="file" id="fileInput" multiple accept=".xml" style="display:none;">
            </div>
            <div id="fileList" class="file-list"></div>
            <div class="controls">
                <label>Листы: <input type="number" id="folioStart" value="117" style="width:60px;"> – 
                <input type="number" id="folioEnd" value="119" style="width:60px;"></label>
                <select id="mainMsSelect" disabled><option>Выберите главный список</option></select>
                <button class="btn" id="alignBtn" disabled>🔗 Выровнять (сервер)</button>
                <button class="btn btn-secondary" id="exportBtn" disabled>💾 XML-TEI</button>
            </div>
            <div id="progress" style="display:none;"></div>
            <div id="alignmentResult"></div>
        </div>
    </div>
    <script>
        let manuscripts = [];
        let alignedData = null;
        const dz = document.getElementById('dropZone');
        const fi = document.getElementById('fileInput');
        const fl = document.getElementById('fileList');
        const ab = document.getElementById('alignBtn');
        const eb = document.getElementById('exportBtn');
        const ms = document.getElementById('mainMsSelect');
        const pd = document.getElementById('progress');

        dz.onclick = () => fi.click();
        dz.ondragover = e => { e.preventDefault(); dz.style.borderColor='#8b7355'; };
        dz.ondragleave = () => { dz.style.borderColor='#c9af91'; };
        dz.ondrop = e => { e.preventDefault(); dz.style.borderColor='#c9af91'; handleFiles(e.dataTransfer.files); };
        fi.onchange = e => handleFiles(e.target.files);

        // Клиентский парсинг XML (мгновенный)
        async function handleFiles(files) {
            pd.style.display = 'block'; pd.innerHTML = '⏳ Парсинг...';
            manuscripts = [];
            for (let file of files) {
                if (!file.name.endsWith('.xml')) continue;
                try {
                    const text = await file.text();
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(text, 'application/xml');
                    const words = [];
                    doc.querySelectorAll('w, pc').forEach(el => {
                        const t = el.textContent.trim();
                        if (t && !'·⸱※∽⁘:.,;!?'.includes(t)) words.push(t);
                    });
                    if (words.length > 0) {
                        manuscripts.push({ name: file.name, words, word_count: words.length, fullText: words.join(' ') });
                    }
                } catch(e) { alert('Ошибка в '+file.name+': '+e.message); return; }
            }
            pd.innerHTML = '✅ Готово: '+manuscripts.length+' списков';
            setTimeout(() => pd.style.display='none', 1500);
            renderList();
        }

        function renderList() {
            fl.innerHTML = manuscripts.map((m,i) => `<div class="file-item"><span>📄 ${m.name} (${m.word_count} слов)</span><span class="file-remove" onclick="manuscripts.splice(${i},1);renderList();updateUI();">✕</span></div>`).join('');
            ms.innerHTML = '<option value="">Выберите главный список</option>' + manuscripts.map((m,i) => `<option value="${i}">${m.name}</option>`).join('');
            updateUI();
        }

        function updateUI() {
            ab.disabled = manuscripts.length < 2 || ms.value === '';
            eb.disabled = !alignedData;
            ms.disabled = manuscripts.length < 2;
        }

        ms.onchange = updateUI;

        // Серверное выравнивание
        ab.onclick = async () => {
            const mainIdx = parseInt(ms.value);
            if (isNaN(mainIdx)) return;
            pd.style.display = 'block'; pd.innerHTML = '⏳ Выравнивание на сервере...';
            try {
                const resp = await fetch('/align', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ manuscripts, main_index: mainIdx })
                });
                if (!resp.ok) throw new Error((await resp.json()).error || 'Ошибка');
                alignedData = await resp.json();
                pd.style.display = 'none';
                renderAlignment(alignedData);
                eb.disabled = false;
            } catch(e) { pd.innerHTML = '❌ '+e.message; }
        };

        function renderAlignment(d) {
            const c = document.getElementById('alignmentResult');
            const s = d.statistics;
            let h = `<div class="stats"><h3>📊 Статистика</h3>`;
            h += `<span class="stat-item">Всего: <b>${s.total}</b></span>`;
            h += `<span class="stat-item">✅ Совпадений: <b>${s.match}</b> (${s.match_percent}%)</span>`;
            h += `<span class="stat-item">✏️ Графические: <b>${s.graphic}</b></span>`;
            h += `<span class="stat-item">🗣️ Фонетические: <b>${s.phonetic}</b></span>`;
            h += `<span class="stat-item">📐 Морфологические: <b>${s.morph}</b></span>`;
            h += `<span class="stat-item">📚 Лексические: <b>${s.lexical}</b></span>`;
            h += `<span class="stat-item">➕ Вставки: <b>${s.insertion}</b></span>`;
            h += `</div>`;
            h += '<div style="overflow:auto;max-height:600px;"><table class="alignment-table"><thead><tr><th>№</th>';
            d.manuscript_names.forEach(n => h += `<th>${n}</th>`);
            h += '<th>Тип</th></tr></thead><tbody>';
            
            const cls = {graphic:'diff-graphic',phonetic:'diff-phonetic',morph:'diff-morph',lexical:'diff-lexical',insertion:'diff-insertion',deletion:'diff-deletion'};
            const lbl = {graphic:'ГР',phonetic:'ФН',morph:'МФ',lexical:'ЛК',insertion:'ВСТ',deletion:'УД'};
            const col = {graphic:'#c0392b',phonetic:'#d4a017',morph:'#27ae60',lexical:'#8e44ad',insertion:'#e74c3c',deletion:'#636e72'};
            
            for (let i = 0; i < d.alignment.length; i++) {
                h += '<tr><td><b>'+(i+1)+'</b></td>';
                d.alignment[i].forEach((w, j) => {
                    const dt = j > 0 && d.diff_types[i] ? d.diff_types[i][j-1] : '';
                    h += `<td class="${cls[dt]||''}">${w||'—'}</td>`;
                });
                h += '<td>';
                if (d.diff_types[i]) {
                    const types = [...new Set(d.diff_types[i].filter(t => t !== 'match'))];
                    types.forEach(t => h += `<span style="background:${col[t]};color:white;padding:2px 6px;border-radius:4px;margin:1px;font-size:11px;">${lbl[t]}</span>`);
                    if (!types.length) h += '✓';
                }
                h += '</td></tr>';
            }
            h += '</tbody></table></div>';
            c.innerHTML = h;
        }

        // Экспорт
        eb.onclick = async () => {
            if (!alignedData) return;
            const resp = await fetch('/export_tei', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ data: alignedData })
            });
            const blob = await resp.blob();
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'aligned_corpus.xml';
            a.click();
        };
    </script>
</body>
</html>
