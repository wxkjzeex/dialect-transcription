<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Параллельный корпус · Притча о блудном сыне</title>
    <style>
        /* ==================== ПОДКЛЮЧЕНИЕ ШРИФТОВ ==================== */
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;600&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Serif', 'Times New Roman', serif;
            background: #f5efe6;
            min-height: 100vh;
            padding: 24px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: #fffbf5;
            border-radius: 24px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            overflow: hidden;
            border: 1px solid #d4c5b0;
        }
        .header {
            background: linear-gradient(135deg, #4a3d2c 0%, #2c241a 100%);
            color: #f0e6d8;
            padding: 24px 32px;
            border-bottom: 3px solid #b89a7a;
        }
        .header h1 { font-size: 28px; font-weight: 400; letter-spacing: 2px; }
        .header p { opacity: 0.8; font-size: 14px; margin-top: 8px; }
        .tabs {
            display: flex;
            background: #e8ddd0;
            padding: 0 24px;
            gap: 4px;
        }
        .tab {
            padding: 14px 24px;
            font-size: 14px;
            font-weight: 600;
            color: #6b5a4a;
            cursor: pointer;
            border-radius: 12px 12px 0 0;
            transition: all 0.2s;
            text-decoration: none;
        }
        .tab:hover { background: #d9cbbc; }
        .tab.active { background: #fffbf5; color: #4a3d2c; }
        .content { padding: 32px; }
        .upload-area {
            border: 2px dashed #c9af91;
            border-radius: 16px;
            padding: 32px;
            text-align: center;
            margin-bottom: 24px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .upload-area:hover { border-color: #8b7355; background: #faf5ef; }
        .btn {
            padding: 12px 24px;
            background: #4a3d2c;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn:hover { background: #5d4e37; transform: translateY(-2px); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-secondary { background: #8b7355; }
        .file-list { margin-top: 16px; }
        .file-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            background: #f0eae2;
            border-radius: 8px;
            margin-bottom: 8px;
        }
        .file-remove { color: #a05040; cursor: pointer; font-weight: bold; }
        .controls {
            display: flex;
            gap: 12px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        
        /* Таблица выравнивания */
        .alignment-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 24px;
            font-size: 14px;
        }
        .alignment-table th {
            text-align: left;
            padding: 12px;
            background: #e8ddd0;
            color: #3e3225;
            font-weight: 600;
            border: 1px solid #d4c5b0;
        }
        .alignment-table td {
            padding: 12px;
            border: 1px solid #d4c5b0;
            vertical-align: top;
        }
        .alignment-table tr:hover td { background: #faf5ef; }
        
        /* Типы разночтений */
        .diff-graphic { background: #fde2e4 !important; border-left: 3px solid #c0392b; }
        .diff-phonetic { background: #fff3cd !important; border-left: 3px solid #d4a017; }
        .diff-morph { background: #d4edda !important; border-left: 3px solid #27ae60; }
        .diff-lexical { background: #e2d5f1 !important; border-left: 3px solid #8e44ad; }
        .diff-syntax { background: #d1ecf1 !important; border-left: 3px solid #2980b9; }
        .diff-insertion { background: #ffe5e0 !important; border-left: 3px solid #e74c3c; }
        .diff-deletion { background: #e0e0e0 !important; border-left: 3px solid #636e72; }
        
        /* Легенда */
        .legend {
            margin: 20px 0;
            padding: 16px;
            background: #f0eae2;
            border-radius: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }
        .legend-color {
            width: 24px;
            height: 16px;
            border-radius: 3px;
            border-left: 3px solid;
        }
        
        /* Статистика */
        .stats {
            margin: 20px 0;
            padding: 16px;
            background: #f8f2ea;
            border-radius: 12px;
            border: 1px solid #d4c5b0;
        }
        .stat-item {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin: 8px 16px 8px 0;
            font-size: 14px;
        }
        
        /* Матрица сходства */
        .similarity-matrix {
            margin: 20px 0;
            overflow-x: auto;
        }
        .similarity-matrix table {
            border-collapse: collapse;
            font-size: 13px;
        }
        .similarity-matrix th, .similarity-matrix td {
            padding: 8px 12px;
            border: 1px solid #d4c5b0;
            text-align: center;
        }
        .similarity-matrix th {
            background: #e8ddd0;
            font-weight: 600;
        }
        .high-sim { background: #d4edda; }
        .med-sim { background: #fff3cd; }
        .low-sim { background: #fde2e4; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📜 Притча о блудном сыне</h1>
            <p>Параллельный корпус · Лк 15:11-32 · Лабораторная работа №2</p>
        </div>
        
        <div class="tabs">
            <a href="/" class="tab">Транскрипция</a>
            <a href="/corpus" class="tab active">Корпус</a>
            <a href="/map" class="tab">Карта</a>
        </div>
        
        <div class="content">
            <div class="upload-area" id="dropZone">
                <div style="font-size: 48px; margin-bottom: 16px;">📂</div>
                <div style="font-size: 18px; margin-bottom: 8px;">Загрузите файлы списков</div>
                <div style="color: #9a8a78;">XML-TEI · Перетащите или нажмите для выбора</div>
                <input type="file" id="fileInput" multiple accept=".xml" style="display: none;">
            </div>
            
            <div id="fileList" class="file-list"></div>
            
            <div class="controls">
                <div style="display: flex; gap: 8px; align-items: center;">
                    <label style="font-size: 13px; color: #3e3225;">Листы главного списка:</label>
                    <input type="number" id="folioStart" placeholder="От" min="1" max="500" value="117" style="width: 70px; padding: 8px; border-radius: 6px; border: 1px solid #d4c5b0;">
                    <span>–</span>
                    <input type="number" id="folioEnd" placeholder="До" min="1" max="500" value="119" style="width: 70px; padding: 8px; border-radius: 6px; border: 1px solid #d4c5b0;">
                </div>
                <button class="btn" id="alignBtn" disabled>🔗 Выровнять списки</button>
                <button class="btn btn-secondary" id="exportBtn" disabled>💾 Выгрузить XML-TEI</button>
                <select id="mainMsSelect" style="padding: 12px; border-radius: 8px; border: 1px solid #d4c5b0;" disabled>
                    <option value="">Выберите главный список</option>
                </select>
            </div>
            
            <div id="progress" style="display: none;"></div>
            <div id="alignmentResult"></div>
        </div>
    </div>
    
    <script>
        let uploadedFiles = [];
        let manuscripts = [];
        let alignedData = null;
        let currentSessionId = null;
        
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const fileList = document.getElementById('fileList');
        const alignBtn = document.getElementById('alignBtn');
        const exportBtn = document.getElementById('exportBtn');
        const mainMsSelect = document.getElementById('mainMsSelect');
        const progressDiv = document.getElementById('progress');
        
        // Drag & drop
        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = '#8b7355';
            dropZone.style.background = '#faf5ef';
        });
        dropZone.addEventListener('dragleave', () => {
            dropZone.style.borderColor = '#c9af91';
            dropZone.style.background = 'transparent';
        });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = '#c9af91';
            dropZone.style.background = 'transparent';
            handleFiles(e.dataTransfer.files);
        });
        fileInput.addEventListener('change', (e) => handleFiles(e.target.files));
        
        // Загрузка файлов на сервер с таймаутом
        async function handleFiles(files) {
            // Очищаем предыдущие
            for (let file of files) {
                if (file.name.endsWith('.xml') && !uploadedFiles.find(f => f.name === file.name)) {
                    uploadedFiles.push(file);
                }
            }
            
            if (uploadedFiles.length === 0) return;
            
            progressDiv.style.display = 'block';
            progressDiv.className = 'progress';
            progressDiv.innerHTML = '⏳ Загрузка файлов на сервер...';
            
            const formData = new FormData();
            let totalSize = 0;
            
            uploadedFiles.forEach(file => {
                formData.append('files', file);
                totalSize += file.size;
            });
            
            // Проверка размера
            if (totalSize > 10 * 1024 * 1024) {
                progressDiv.innerHTML = '❌ Суммарный размер файлов превышает 10MB. Загрузите меньше файлов.';
                return;
            }
            
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 60000); // 60 секунд таймаут
                
                progressDiv.innerHTML = `⏳ Отправка ${uploadedFiles.length} файлов (${(totalSize/1024).toFixed(0)}KB)...`;
                
                const response = await fetch('/upload_corpus', {
                    method: 'POST',
                    body: formData,
                    signal: controller.signal
                });
                
                clearTimeout(timeoutId);
                
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Ошибка сервера: ${response.status} - ${errorText.substring(0, 200)}`);
                }
                
                const result = await response.json();
                
                if (result.errors && result.errors.length > 0) {
                    console.warn('Предупреждения парсинга:', result.errors);
                }
                
                manuscripts = result.manuscripts || [];
                
                if (manuscripts.length === 0) {
                    progressDiv.innerHTML = '❌ Не удалось распарсить файлы. Проверьте формат XML.';
                    return;
                }
                
                progressDiv.innerHTML = `✅ Загружено ${manuscripts.length} списков за ${result.parse_time || '?'}с`;
                setTimeout(() => { progressDiv.style.display = 'none'; }, 2000);
                
            } catch (err) {
                if (err.name === 'AbortError') {
                    progressDiv.innerHTML = '❌ Превышено время ожидания (60с). Попробуйте файлы меньшего размера.';
                } else {
                    progressDiv.innerHTML = '❌ Ошибка: ' + err.message;
                }
                console.error(err);
            }
            
            renderFileList();
            updateUI();
        }
        
        function renderFileList() {
            if (uploadedFiles.length === 0) {
                fileList.innerHTML = '';
                return;
            }
            let html = '<h3 style="margin-bottom: 12px; color: #3e3225;">Загруженные списки:</h3>';
            manuscripts.forEach((ms, index) => {
                html += `
                    <div class="file-item">
                        <span>📄 ${ms.name} <span style="color: #8b7355;">(${ms.word_count || '?'} слов)</span></span>
                        <span class="file-remove" onclick="removeFile(${index})">✕</span>
                    </div>
                `;
            });
            fileList.innerHTML = html;
            
            let options = '<option value="">Выберите главный список</option>';
            manuscripts.forEach((ms, index) => {
                options += `<option value="${index}">${ms.name} (${ms.word_count || '?'} слов)</option>`;
            });
            mainMsSelect.innerHTML = options;
        }
        
        window.removeFile = function(index) {
            uploadedFiles.splice(index, 1);
            manuscripts.splice(index, 1);
            alignedData = null;
            document.getElementById('alignmentResult').innerHTML = '';
            renderFileList();
            updateUI();
        };
        
        function updateUI() {
            alignBtn.disabled = manuscripts.length < 2;
            exportBtn.disabled = !alignedData;
            mainMsSelect.disabled = manuscripts.length < 2;
        }
        
        // Выравнивание
        alignBtn.addEventListener('click', async () => {
            const mainIndex = parseInt(mainMsSelect.value);
            if (isNaN(mainIndex)) {
                alert('Выберите главный список');
                return;
            }
            
            progressDiv.style.display = 'block';
            progressDiv.innerHTML = '⏳ Выполняется выравнивание... (может занять до 30 секунд)';
            
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 120000);
                
                const response = await fetch('/align', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        manuscripts: manuscripts,
                        main_index: mainIndex,
                        folio_start: document.getElementById('folioStart').value,
                        folio_end: document.getElementById('folioEnd').value
                    }),
                    signal: controller.signal
                });
                
                clearTimeout(timeoutId);
                
                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.error || `Ошибка сервера: ${response.status}`);
                }
                
                const result = await response.json();
                alignedData = result;
                currentSessionId = result.session_id;
                
                progressDiv.style.display = 'none';
                renderAlignment(result);
                exportBtn.disabled = false;
                
            } catch (err) {
                if (err.name === 'AbortError') {
                    progressDiv.innerHTML = '❌ Превышено время ожидания. Попробуйте ограничить диапазон листов.';
                } else {
                    progressDiv.innerHTML = '❌ Ошибка выравнивания: ' + err.message;
                }
                console.error(err);
            }
        });
        
        function renderAlignment(data) {
            const container = document.getElementById('alignmentResult');
            
            if (!data.alignment || data.alignment.length === 0) {
                container.innerHTML = '<p style="color: red;">Нет данных для отображения</p>';
                return;
            }
            
            let html = '';
            
            // Статистика
            if (data.statistics) {
                const s = data.statistics;
                html += `
                <div class="stats">
                    <h3>📊 Статистика разночтений (время выравнивания: ${data.align_time || '?'}с)</h3>
                    <div class="stat-item">📝 Всего позиций: <strong>${s.total || 0}</strong></div>
                    <div class="stat-item">✅ Совпадений: <strong>${s.matches || 0}</strong> (${s.match_percent || 0}%)</div>
                    <div class="stat-item">✏️ Графические: <strong>${s.graphic || 0}</strong></div>
                    <div class="stat-item">🗣️ Фонетические: <strong>${s.phonetic || 0}</strong></div>
                    <div class="stat-item">📐 Морфологические: <strong>${s.morph || 0}</strong></div>
                    <div class="stat-item">📚 Лексические: <strong>${s.lexical || 0}</strong></div>
                    <div class="stat-item">➕ Вставки: <strong>${s.insertion || 0}</strong></div>
                    <div class="stat-item">➖ Удаления: <strong>${s.deletion || 0}</strong></div>
                </div>`;
            }
            
            // Легенда
            html += `
            <div class="legend">
                <div class="legend-item"><div class="legend-color" style="background: #fde2e4; border-color: #c0392b;"></div> Графические</div>
                <div class="legend-item"><div class="legend-color" style="background: #fff3cd; border-color: #d4a017;"></div> Фонетические</div>
                <div class="legend-item"><div class="legend-color" style="background: #d4edda; border-color: #27ae60;"></div> Морфологические</div>
                <div class="legend-item"><div class="legend-color" style="background: #e2d5f1; border-color: #8e44ad;"></div> Лексические</div>
                <div class="legend-item"><div class="legend-color" style="background: #ffe5e0; border-color: #e74c3c;"></div> Вставки</div>
            </div>`;
            
            // Таблица
            html += '<h3>📖 Пословное выравнивание (показаны первые 100 строк)</h3>';
            html += '<div style="overflow-x: auto; max-height: 600px; overflow-y: auto; border: 1px solid #d4c5b0; border-radius: 8px;">';
            html += '<table class="alignment-table"><thead><tr><th>№</th>';
            
            data.manuscript_names.forEach((name, i) => {
                html += `<th>${name}${i === 0 ? ' (главный)' : ''}</th>`;
            });
            
            html += '<th>Тип</th></tr></thead><tbody>';
            
            // Ограничиваем отображение
            const maxRows = Math.min(data.alignment.length, 100);
            
            for (let i = 0; i < maxRows; i++) {
                const row = data.alignment[i];
                html += '<tr>';
                html += `<td><strong>${i + 1}</strong></td>`;
                
                const mainWord = row[0];
                
                for (let j = 0; j < row.length; j++) {
                    const word = row[j];
                    let cellClass = '';
                    
                    if (j > 0 && data.diff_types && data.diff_types[i]) {
                        const dt = data.diff_types[i][j - 1];
                        if (dt === 'graphic') cellClass = 'diff-graphic';
                        else if (dt === 'phonetic') cellClass = 'diff-phonetic';
                        else if (dt === 'morph') cellClass = 'diff-morph';
                        else if (dt === 'lexical') cellClass = 'diff-lexical';
                        else if (dt === 'insertion') cellClass = 'diff-insertion';
                        else if (dt === 'deletion') cellClass = 'diff-deletion';
                    }
                    
                    html += `<td class="${cellClass}">${word || '—'}</td>`;
                }
                
                // Типы
                html += '<td>';
                if (data.diff_types && data.diff_types[i]) {
                    const types = [...new Set(data.diff_types[i].filter(t => t !== 'match'))];
                    if (types.length > 0) {
                        types.forEach(type => {
                            const labels = {
                                'graphic': 'ГР', 'phonetic': 'ФН', 'morph': 'МФ',
                                'lexical': 'ЛК', 'insertion': 'ВСТ', 'deletion': 'УД'
                            };
                            const colors = {
                                'graphic': '#c0392b', 'phonetic': '#d4a017', 'morph': '#27ae60',
                                'lexical': '#8e44ad', 'insertion': '#e74c3c', 'deletion': '#636e72'
                            };
                            html += `<span style="background:${colors[type]};color:white;padding:2px 6px;border-radius:4px;margin:2px;font-size:11px;">${labels[type]}</span>`;
                        });
                    } else {
                        html += '✓';
                    }
                }
                html += '</td></tr>';
            }
            
            if (data.alignment.length > 100) {
                html += `<tr><td colspan="${data.manuscript_names.length + 2}" style="text-align:center;color:#8b7355;">
                    Показаны первые 100 из ${data.alignment.length} строк
                </td></tr>`;
            }
            
            html += '</tbody></table></div>';
            
            container.innerHTML = html;
        }
        
        // Экспорт
        exportBtn.addEventListener('click', async () => {
            if (!alignedData) return;
            
            try {
                progressDiv.style.display = 'block';
                progressDiv.innerHTML = '⏳ Генерация XML...';
                
                const response = await fetch('/export_tei', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        session_id: currentSessionId,
                        data: alignedData
                    })
                });
                
                if (!response.ok) throw new Error('Ошибка экспорта');
                
                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'aligned_corpus.xml';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                
                progressDiv.style.display = 'none';
                
            } catch (err) {
                progressDiv.innerHTML = '❌ Ошибка: ' + err.message;
            }
        });
    </script>
</body>
</html>
